name: Build Harry Potter Bezza APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir buildsrc
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d buildsrc

      - name: Build APK
        run: gradle -p buildsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarryPotter-Bezza-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
